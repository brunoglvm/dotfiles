# Playback
SPACE           cycle pause
PLAYPAUSE       cycle pause
p               cycle pause

# Navigation/Seek
LEFT            seek -5
RIGHT           seek +5
DOWN            add volume -5
UP              add volume +5
PGUP            seek +600
PGDWN           seek -600
Shift+LEFT      seek -1 exact
Shift+RIGHT     seek +1 exact
Ctrl+LEFT       seek -30
Ctrl+RIGHT      seek +30

# Speed
[               add speed -0.1
]               add speed +0.1
{               multiply speed 0.5
}               multiply speed 2.0
BACKSPACE       set speed 1.0

# Volume
0               add volume +5
9               add volume -5
m               cycle mute
MOUSE_BTN3      add volume +5
MOUSE_BTN4      add volume -5

# Fullscreen
f               cycle fullscreen
F               cycle fullscreen
ENTER           cycle fullscreen
ESC             set fullscreen no

# Window
t               cycle ontop
Ctrl+f          cycle fullscreen

# Subtitles
v               cycle sub
V               cycle sub-visibility
j               cycle sub
J               cycle sub down
Shift+v         add sub-delay +0.1
Ctrl+v          add sub-delay -0.1
z               add sub-delay -0.1
Z               add sub-delay +0.1
r               add sub-pos -1
R               add sub-pos +1

# Audio
a               cycle audio
A               cycle audio down
Shift+a         add audio-delay +0.1
Ctrl+a          add audio-delay -0.1

# Playlist
n               playlist-next
N               playlist-prev
>               playlist-next
<               playlist-prev
q               quit
Q               quit-watch-later

# Screenshot
s               screenshot
S               screenshot video
Ctrl+s          screenshot window

# Display
1               add contrast -1
2               add contrast +1
3               add brightness -1
4               add brightness +1
5               add gamma -1
6               add gamma +1
7               add saturation -1
8               add saturation +1

# Others
i               script-binding stats/display-stats-toggle
I               show-text ${filename}
o               show-progress
O               cycle-values osd-level 3 1
TAB             cycle-values osd-level 3 1
?               show-text "Atalhos: SPACE/p/PLAYPAUSE=pause | ←/→=±5s | ↑/↓=volume | f=tela cheia | m=mudo | v=legenda | a=áudio | n/N=playlist | q=sair" 5000
